# STEPSS scenario. Save configuration wrote this; Load configuration reads it.
# Paths inside this file's own directory are stored relative to it, so the
# folder can be moved or copied whole. Everything else is absolute.
# Scenario: IEEE Nordic, operating point A, trip of line 4032-4044. Collapses near t = 165 s by design.

stepss.format = 1

# System data
data.1 = lf_A.dat
data.2 = dyn_A.dat
data.3 = settings1.dat
disturbance = trip_branch.dst
diagram = nordic.svg

# Observables
observables.file = obs.dat
runtime.1.type = Machine Speed
runtime.1.name = g6
runtime.2.type = 
runtime.2.name = 
runtime.3.type = 
runtime.3.name = 

# Recording
record.trajectory = true
record.continuous = false
record.discrete = true
record.init = true
